# Release pipeline: builds the recall and recall-server binaries for all
# supported platforms and publishes a GitHub release with auto-generated
# notes (grouped from conventional commit messages since the last tag).
#
# Three ways in, and the second one exists because the first silently did
# not cover the automated path. A tag pushed by a workflow using the
# repository's own GITHUB_TOKEN does not trigger further workflows, so
# tag.yml reported success, the tag appeared, and nothing published --
# for v0.3.0 and v0.3.1 both. v0.2.0 has a release only because that tag
# was pushed by hand.
#
#   push of a vX.Y.Z tag   a tag pushed by a person
#   workflow_call          tag.yml, immediately after it pushes the tag
#   workflow_dispatch      recovery: publish for a tag that already exists
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: "The tag to publish a release for"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for (e.g. v0.3.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # One name for the tag whichever trigger fired. github.ref_name is the
      # tag only on the push trigger; on the other two it is the branch the
      # caller ran from, which would publish a release named `main`.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0 # release notes need the commit range since the last tag

      - name: The ref must be a release tag
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to release from '$TAG': not a vX.Y.Z tag" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$TAG" >/dev/null

      # The same two steps go.yml carries, for the same reason, and their
      # absence here is why this job could not have published even once the
      # trigger was fixed: govern's fail-closed contract is vendored from
      # cadre and TestTheContractMatchesItsOrigin hard-fails under CI rather
      # than skipping. go.yml's own comment records that this is how v0.3.0
      # came to be tagged with its job red -- and then the fix landed in one
      # workflow and not the other, so the guard failed here for want of the
      # file rather than for divergence.
      - name: Check out cadre (origin of the fail-closed contract)
        uses: actions/checkout@v4
        with:
          repository: deagy/cadre
          path: .cadre-origin
          fetch-depth: 1

      - name: Point the contract guard at its origin
        run: |
          origin="$GITHUB_WORKSPACE/.cadre-origin/internal/knowledge/testdata/fail-closed-contract.json"
          if [ ! -f "$origin" ]; then
            echo "::error::cadre's fail-closed contract is not at $origin;"
            echo "::error::the guard cannot run, and it must not be skipped under CI."
            exit 1
          fi
          echo "CADRE_FAIL_CLOSED_CONTRACT=$origin" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Verify build and tests
        run: |
          go build ./...
          go test ./... -count=1

      - name: Build release binaries
        run: ./scripts/release-build.sh "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: if a release for this tag already exists (e.g. the
          # tag was force-moved onto a fixed commit), replace its assets
          # and notes. The tag itself is left untouched.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*
