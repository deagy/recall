# Automated semantic-version tagging.
#
# Triggered manually (Actions -> "Tag release" -> Run workflow). Computes the
# next vX.Y.Z from the latest existing tag based on the requested bump and
# pushes an annotated tag, which in turn triggers release.yml.
name: Tag release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version part to bump"
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags needed to find the latest version

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 || true)
          latest=${latest:-v0.0.0}
          v=${latest#v}
          IFS=. read -r maj min pat <<<"$v"
          case "${{ inputs.bump }}" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            patch) pat=$((pat + 1)) ;;
            *) echo "unexpected bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac
          next="v${maj}.${min}.${pat}"
          echo "latest tag: ${latest} -> next: ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.version }}" \
            -m "Release ${{ steps.next.outputs.version }}"
          git push origin "${{ steps.next.outputs.version }}"
          echo "pushed tag ${{ steps.next.outputs.version }} (release workflow will pick it up)"
