# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: vet
      run: go vet ./...

    - name: Check formatting
      run: |
        unformatted=$(gofmt -s -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt -s required on:"
          echo "$unformatted"
          exit 1
        fi

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test ./... -count=1 -race

    # Smoke-run every benchmark once; CI does not assert benchmark numbers.
    - name: Bench
      run: go test ./... -run=^$ -bench=. -benchtime=1x -count=1
