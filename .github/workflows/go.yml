# Continuous integration: lint, build, test, coverage gate, security scans,
# and benchmark regression detection.
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          args: --timeout=10m

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # govern's fail-closed contract is vendored from cadre, which is its
      # origin. TestTheContractMatchesItsOrigin hard-fails under CI rather
      # than skipping, on purpose: a guard that silently skips is not a guard.
      # It needs the origin file to compare against, and without this checkout
      # it failed for want of the file rather than for divergence -- which is
      # how v0.3.0 was tagged with this job red.
      #
      # Read-only, shallow, and non-fatal if cadre ever moves: the step below
      # sets CADRE_FAIL_CLOSED_CONTRACT only when the file is actually there,
      # so a rename in the other repository surfaces as this guard failing
      # with its own message rather than as a checkout error.
      - name: Check out cadre (origin of the fail-closed contract)
        uses: actions/checkout@v4
        with:
          repository: deagy/cadre
          path: .cadre-origin
          fetch-depth: 1

      - name: Point the contract guard at its origin
        run: |
          origin="$GITHUB_WORKSPACE/.cadre-origin/internal/knowledge/testdata/fail-closed-contract.json"
          if [ ! -f "$origin" ]; then
            echo "::error::cadre's fail-closed contract is not at $origin;"
            echo "::error::the guard cannot run, and it must not be skipped under CI."
            exit 1
          fi
          echo "CADRE_FAIL_CLOSED_CONTRACT=$origin" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -s required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./... -count=1 -race

      # Coverage regression gate: overall statement coverage must stay >= 80%.
      - name: Coverage gate (>= 80%)
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "overall coverage: ${total}%"
          if awk "BEGIN {exit !($total < 80)}"; then
            echo "::error::overall coverage ${total}% is below the 80% gate"
            exit 1
          fi

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      # Smoke-run every benchmark once; numbers are checked in the
      # benchmark job below.
      - name: Bench smoke
        run: go test ./... -run=^$ -bench=. -benchtime=1x -count=1

  security:
    name: Vulnerability & License Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      # Dependency vulnerability scanning (golang.org/x/vuln).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # License compliance: all direct and indirect dependency licenses must
      # be permissive (default allowlist: MIT, Apache-2.0, BSD-*, ISC, ...).
      #
      # Exclusion (verified 2026-08-19): modernc.org/mathutil ships a
      # BSD-3-Clause LICENSE file that go-licenses' content classifier
      # fails to recognize (its wording omits the standard "The BSD
      # License" heading), so the check reports "Unknown license type"
      # for this transitive dependency of modernc.org/sqlite.
      - name: License check
        run: |
          go run github.com/google/go-licenses@latest check \
            --ignore modernc.org/mathutil ./...

  benchmark:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: current

      # Pull requests are compared against their merge base; pushes to main
      # only record results as an artifact.
      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Run benchmarks (current)
        working-directory: current
        run: go test ./... -run=^$ -bench=. -benchtime=10x -benchmem -count=1 > ../bench-current.txt

      - name: Run benchmarks (base)
        if: github.event_name == 'pull_request'
        working-directory: base
        run: go test ./... -run=^$ -bench=. -benchtime=10x -benchmem -count=1 > ../bench-base.txt

      - name: Compare
        if: github.event_name == 'pull_request'
        run: ./current/scripts/benchcompare.sh bench-base.txt bench-current.txt 50

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-*.txt
